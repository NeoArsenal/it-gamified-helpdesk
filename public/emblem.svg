<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo Corporativo Azul Limatambo -->
  <rect width="512" height="512" rx="116" fill="#134685" />

  <!-- Círculo Central Blanco Nítido -->
  <circle cx="256" cy="256" r="184" fill="#ffffff" />

  <!-- Líneas "L" Institucionales de Limatambo en Azul Marino -->
  <!-- Línea exterior de la L -->
  <path d="M 238 74 L 238 272 L 438 272" fill="none" stroke="#134685" stroke-width="16" stroke-linecap="square" />
  <!-- Línea interior de la L -->
  <path d="M 264 74 L 264 246 L 438 246" fill="none" stroke="#134685" stroke-width="16" stroke-linecap="square" />

  <!-- 1. Cuadrante Superior Derecho: Cruz Roja Médica Oficial -->
  <g fill="#d81e28">
    <path d="M 324 126 L 366 126 L 366 168 L 408 168 L 408 210 L 366 210 L 366 252 L 324 252 L 324 210 L 282 210 L 282 168 L 324 168 Z" />
  </g>

  <!-- 2. Cuadrante Superior Izquierdo: Monitor / TI Soporte y Redes -->
  <g stroke="#d81e28" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor / Marco de Pantalla -->
    <rect x="124" y="138" width="96" height="76" rx="7" />
    <!-- Soporte y Base de Monitor -->
    <line x1="172" y1="214" x2="172" y2="238" stroke-width="6" />
    <line x1="148" y1="238" x2="196" y2="238" stroke-width="6" />
    <!-- Cable / Conector de Red a Servidor -->
    <path d="M 172 226 L 194 226 L 194 244 L 214 244" stroke-width="5" />
    
    <!-- Gráfico interno de red / Conector RJ45 dentro de la pantalla -->
    <rect x="140" y="150" width="64" height="44" rx="4" fill="#d81e28" stroke="none" />
    <!-- Ranuras / Pines del conector RJ45 -->
    <rect x="146" y="150" width="5" height="12" fill="#ffffff" stroke="none" />
    <rect x="154" y="150" width="5" height="12" fill="#ffffff" stroke="none" />
    <rect x="162" y="150" width="5" height="12" fill="#ffffff" stroke="none" />
    <rect x="170" y="150" width="5" height="12" fill="#ffffff" stroke="none" />
    <rect x="178" y="150" width="5" height="12" fill="#ffffff" stroke="none" />
    <rect x="186" y="150" width="5" height="12" fill="#ffffff" stroke="none" />
    <!-- Señal de Pulso / Monitoreo ECG -->
    <path d="M 146 179 L 158 179 L 164 166 L 172 185 L 178 179 L 198 179" fill="none" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- 3. Mitad Inferior: Paciente en Cama Hospitalaria -->
  <g fill="#d81e28">
    <!-- Cabeza del paciente -->
    <circle cx="168" cy="344" r="18" />
    <!-- Cuerpo del paciente recostado -->
    <path d="M 192 346 C 204 322 236 314 258 324 L 348 346 C 360 350 372 348 376 342 L 380 342 C 380 354 370 360 356 358 L 218 358 C 198 358 188 354 192 346 Z" />
    <!-- Brazo / Mano asistida -->
    <path d="M 216 344 L 242 316 L 252 324 L 228 348 Z" />
    <!-- Camilla / Base de la cama clínica -->
    <rect x="158" y="366" width="224" height="12" rx="6" />
    <!-- Patas de la camilla con ruedas -->
    <rect x="188" y="378" width="10" height="16" rx="3" />
    <rect x="330" y="378" width="10" height="16" rx="3" />
  </g>
</svg>
